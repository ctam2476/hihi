<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chúc Mừng 20/10 💕</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }
    canvas { display:block; cursor:pointer; touch-action:manipulation; }

    /* ─── MODAL ─── */
    .ov {
      position:fixed; inset:0;
      background:rgba(0,0,10,.92);
      display:flex; align-items:center; justify-content:center;
      z-index:999; opacity:0; pointer-events:none;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:opacity .45s;
    }
    .ov.show { opacity:1; pointer-events:all; }
    .card {
      position:relative;
      background:linear-gradient(145deg,#18001f,#2f003c);
      border:1px solid rgba(255,100,185,.22);
      border-radius:22px;
      padding:clamp(24px,5vw,44px) clamp(18px,5vw,36px) clamp(20px,4vw,34px);
      max-width:490px; width:92vw;
      box-shadow:0 0 55px rgba(200,30,140,.2),0 20px 55px rgba(0,0,0,.8),
                 inset 0 1px 0 rgba(255,255,255,.04);
      transform:scale(.72) translateY(40px);
      transition:transform .5s cubic-bezier(.14,1,.34,1);
      text-align:center; font-family:Georgia,serif;
    }
    .ov.show .card { transform:scale(1) translateY(0); }
    .card::before{content:'🌸';position:absolute;top:12px;left:15px;font-size:1.2rem;opacity:.45;}
    .card::after {content:'🌸';position:absolute;bottom:12px;right:15px;font-size:1.2rem;opacity:.45;}
    .c-date {
      font-size:clamp(2rem,7vw,2.9rem); font-weight:700;
      background:linear-gradient(90deg,#ff6eb4,#ffd6ec,#ff3d96);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; line-height:1; margin-bottom:4px;
    }
    .c-sub {
      color:rgba(255,200,225,.45); font-size:clamp(.62rem,.9vw+.3rem,.75rem);
      letter-spacing:3px; text-transform:uppercase; margin-bottom:16px;
    }
    .div { width:48px;height:2px;background:linear-gradient(90deg,transparent,#ff79b0,transparent);margin:0 auto 16px; }
    .msg {
      color:#ffeaf3; font-family:inherit;
      font-size:clamp(.86rem,2vw,.98rem); line-height:1.9;
      min-height:70px; padding:11px 13px; border-radius:12px;
      border:1px dashed rgba(255,120,180,.25);
      background:rgba(255,255,255,.035);
      text-align:left; outline:none; white-space:pre-wrap;
      transition:border-color .3s, background .3s;
    }
    .msg:focus{border-color:rgba(255,120,180,.55);background:rgba(255,255,255,.06);}
    .enote{margin-top:5px;font-size:.63rem;color:rgba(255,160,210,.3);letter-spacing:.7px;}
    .cbtn {
      margin-top:18px; width:100%; padding:clamp(9px,2vw,12px);
      background:linear-gradient(135deg,#b5135a,#e01a8a);
      color:#fff; border:none; border-radius:13px;
      font-size:clamp(.82rem,2vw,.93rem); letter-spacing:1px;
      cursor:pointer; font-family:inherit;
      box-shadow:0 5px 18px rgba(180,20,100,.42);
      transition:opacity .2s,transform .15s;
    }
    .cbtn:hover{opacity:.88;} .cbtn:active{transform:scale(.97);}

    .burst {
      position:fixed; pointer-events:none; z-index:1000; font-size:var(--sz);
      animation:bA 1.1s ease-out forwards;
    }
    @keyframes bA {
      from{transform:translate(0,0) scale(1);opacity:1;}
      to  {transform:translate(var(--tx),var(--ty)) scale(.08);opacity:0;}
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov" id="ov">
  <div class="card">
    <div class="c-date">anh iu em</div>
    <div class="c-sub"></div>
    <div class="div"></div>
    <div class="msg" contenteditable="true" spellcheck="false">em an cut cho</div>
    
    <button class="cbtn" id="cbtn">💝 Đóng lại</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   CANVAS SETUP – full-screen, responsive
═══════════════════════════════════════════ */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

let W, H, S, CX, CY, WY;

function setup() {
  W = cv.width  = window.innerWidth;
  H = cv.height = window.innerHeight;
  // Heart parametric range: hx∈[-16,16], hy∈[-12,17]
  // We want heart ≈ 38% of narrower dimension
  S  = Math.min(W, H) * 0.38 / 32;   // ← KEY FIX: correct scale
  CX = W / 2;
  CY = H * 0.30;                       // heart centre
  WY = CY + 17.5 * S;                 // water surface (below heart tip)
}
setup();
window.addEventListener('resize', () => { setup(); makePts(); });

/* ═══════════════════════════════════════════
   HEART FUNCTIONS (parametric)
═══════════════════════════════════════════ */
const hx = t => 16 * Math.pow(Math.sin(t), 3);
const hy = t => -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
// hx ∈ [-16, 16], hy ∈ [-12, 17]

/* ═══════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════ */
const N = 720;
let pts = [];

function rCol() {
  return `hsl(${326+Math.random()*28},${80+Math.random()*20}%,${50+Math.random()*36}%)`;
}

function makePts() {
  pts = [];
  for (let i = 0; i < N; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), .32); // weight toward edge → dense outline
    pts.push({
      lx:  hx(t) * r,   // local heart coords
      ly:  hy(t) * r,
      col: rCol(),
      sz:  .7 + Math.random() * 2.2,
      al:  .42 + Math.random() * .58,
      ph:  Math.random() * Math.PI * 2,
    });
  }
}
makePts();

/* ═══════════════════════════════════════════
   BACKGROUND STARS
═══════════════════════════════════════════ */
const STARS = Array.from({length:110}, () => ({
  rx: Math.random(), ry: Math.random()*.7,
  r : .3 + Math.random(),
  b : .05 + Math.random()*.42,
  sp: .5 + Math.random()*2.5,
  ph: Math.random()*Math.PI*2,
}));

/* ═══════════════════════════════════════════
   RIPPLES
═══════════════════════════════════════════ */
let ripples = [], lastR = 0;

/* ═══════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════ */
let prev = null;
(function loop(ts) {
  requestAnimationFrame(loop);
  if (!prev) prev = ts;
  const dt = Math.min((ts-prev)/1000, .05);
  prev = ts;
  const t = ts / 1000;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const rotY = t * .65;          // spin speed
  const cosR = Math.cos(rotY);
  const sinR = Math.sin(rotY);
  const beat = 1 + .055*Math.abs(Math.sin(t*2.6));

  drawStars(t);

  if (t - lastR > 1.05) { ripples.push({born:t}); lastR = t; }
  ripples = ripples.filter(r => t-r.born < 4.8);

  drawReflect(cosR, sinR, beat);
  drawRipples(t);
  drawHeart(cosR, sinR, beat);
})();

/* ─── STARS ─── */
function drawStars(t) {
  for (const s of STARS) {
    const a = s.b*(.5+.5*Math.sin(t*s.sp+s.ph));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.rx*W, s.ry*H, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

/* ─── HEART (3-D Y-axis rotation) ─── */
function drawHeart(cosR, sinR, beat) {
  // Depth-sort: back (z<0) first, front (z>0) last
  const ordered = pts
    .map(p => ({ p, z: p.lx * sinR }))
    .sort((a, b) => a.z - b.z);

  for (const {p, z} of ordered) {
    const sx = CX + p.lx * cosR * S * beat;
    const sy = CY + p.ly * S * beat;

    // 0 = back, 1 = front
    const df = (z / 16 + 1) * .5;

    ctx.save();
    ctx.globalAlpha = p.al * (.28 + .72*df);
    if (df > .55) { ctx.shadowColor = p.col; ctx.shadowBlur = 7*df; }
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(.25, p.sz*(.55+.5*df)*beat), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

/* ─── REFLECTION ─── */
function drawReflect(cosR, sinR, beat) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, WY, W, H-WY);
  ctx.clip();

  const FADE = S * 9;

  for (const p of pts) {
    const sx = CX + p.lx*cosR*S*beat;
    const sy = CY + p.ly*S*beat;
    const ry = 2*WY - sy;           // mirror across water line

    if (ry <= WY || ry > WY+FADE) continue;

    const dist = ry - WY;
    const fa   = Math.max(0, 1-dist/FADE) * p.al * .36;

    ctx.globalAlpha = fa;
    ctx.fillStyle   = p.col;
    ctx.beginPath();
    ctx.arc(sx, ry, p.sz*.7, 0, Math.PI*2);
    ctx.fill();
  }

  // Gradient fog
  const gr = ctx.createLinearGradient(0, WY, 0, WY+FADE);
  gr.addColorStop(0,   'rgba(0,0,0,0)');
  gr.addColorStop(.5,  'rgba(0,0,0,.18)');
  gr.addColorStop(1,   'rgba(0,0,0,.88)');
  ctx.globalAlpha = 1;
  ctx.fillStyle   = gr;
  ctx.fillRect(0, WY, W, FADE);
  ctx.restore();
}

/* ─── RIPPLE RINGS + TEXT ─── */
function drawRipples(t) {
  const maxA = Math.min(W, H) * .34;
  const eCY  = WY + maxA*.14;
  const WORD = 'Thùy Linh iu';

  // Animated ripples
  for (const r of ripples) {
    const prog = (t - r.born) / 4.8;
    for (let k = 0; k < 6; k++) {
      const rp = Math.max(0, prog - k*.042);
      if (rp <= 0 || rp >= 1) continue;
      const a = maxA*rp, b = a*.17;
      const al = (1-rp)*.52;
      ctx.save();
      ctx.globalAlpha = al;
      ctx.strokeStyle = 'rgba(210,80,150,1)';
      ctx.lineWidth   = .8;
      ctx.shadowColor = 'rgba(220,60,160,.5)';
      ctx.shadowBlur  = 5;
      ctx.beginPath();
      ctx.ellipse(CX, eCY, a, b, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
      // text on ring k=2
      if (k===2 && a>48 && al>.12)
        ellipseText(WORD, CX, eCY, a*.92, b*.92, al*.85, 0);
    }
  }

  // Static dashed base ring
  const bA = maxA*.62, bB = bA*.17;
  ctx.save();
  ctx.globalAlpha = .26;
  ctx.strokeStyle = 'rgba(200,70,140,1)';
  ctx.lineWidth   = .6;
  ctx.setLineDash([5,10]);
  ctx.beginPath();
  ctx.ellipse(CX, eCY, bA, bB, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();

  // Orbiting text (quay vòng)
  ellipseText(WORD, CX, eCY, bA*.9, bB*.9, .55, t*.28);

  // "20.10" label
  const lblY = eCY + bB + Math.min(W,H)*.09;
  if (lblY < H-10) {
    ctx.save();
    ctx.globalAlpha  = .7 + .13*Math.sin(t*1.5);
    ctx.fillStyle    = '#e082b9';
    ctx.shadowColor  = 'rgba(255,80,160,.7)';
    ctx.shadowBlur   = 12;
    ctx.font         = `italic bold ${Math.round(Math.min(W,H)*.038)}px Georgia,serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('❤  20.10  ❤', CX, lblY);
    ctx.restore();
  }
}

function ellipseText(text, cx, cy, a, b, alpha, offset) {
  const chars = [...text];
  const n     = chars.length;
  const arc   = Math.PI;
  const start = Math.PI + (offset||0);
  const fs    = Math.max(9, Math.round(Math.min(W,H)*.021));
  ctx.save();
  ctx.globalAlpha  = alpha;
  ctx.fillStyle    = 'rgba(225,130,180,1)';
  ctx.font         = `italic ${fs}px Georgia,serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  chars.forEach((ch, i) => {
    const angle = start + (n>1 ? i/(n-1) : .5) * arc;
    ctx.save();
    ctx.translate(cx + a*Math.cos(angle), cy + b*Math.sin(angle));
    ctx.rotate(angle + Math.PI/2);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

/* ═══════════════════════════════════════════
   INTERACTION
═══════════════════════════════════════════ */
function tryOpen(ex, ey) {
  const rect = cv.getBoundingClientRect();
  const dx = (ex - rect.left  - CX) / (16*S);
  const dy = (ey - rect.top   - CY) / (12*S);
  if (dx*dx*.7 + dy*dy > 2.2) return;
  burst(ex, ey);
  setTimeout(() => document.getElementById('ov').classList.add('show'), 380);
}

cv.addEventListener('click', e => tryOpen(e.clientX, e.clientY));
cv.addEventListener('touchend', e => {
  e.preventDefault();
  tryOpen(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, {passive:false});

function burst(cx, cy) {
  const ems=['💖','💕','💗','💓','🌸','✨','🌺','💝','❤️','🩷'];
  for (let i=0;i<22;i++) {
    const angle=(i/22)*Math.PI*2+Math.random()*.3;
    const dist =70+Math.random()*130;
    const el=document.createElement('div');
    el.className='burst';
    el.textContent=ems[Math.floor(Math.random()*ems.length)];
    el.style.left=cx+'px'; el.style.top=cy+'px';
    el.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    el.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    el.style.setProperty('--sz',(.8+Math.random())+'rem');
    el.style.animationDelay=Math.random()*.28+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

function closeModal() { document.getElementById('ov').classList.remove('show'); }
document.getElementById('cbtn').addEventListener('click', closeModal);
document.getElementById('ov').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

</script>
</body>
</html>
